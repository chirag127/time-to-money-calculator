<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  <!-- Clock Circle -->
  <circle cx="50" cy="50" r="34" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.9" />
  <!-- Clock Hands pointing to 10 past 10 -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="50" x2="68" y2="50" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
  <!-- Currency badge -->
  <circle cx="74" cy="74" r="16" fill="#0f172a" />
  <text x="74" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">₹</text>
</svg>
